<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <style>
        :root {
            --primary-color: #2196f3;
            --primary-color-dark: #1565c0;
            --primary-color-active: #0d47a1;
            --background-color: #f5f5f5;
            --surface-color: #ffffff;
            --surface-border: rgba(15, 23, 42, 0.08);
            --surface-muted: #eef6ff;
            --card-back: #1976d2;
            --card-front: #ffffff;
            --text-color: #333333;
            --muted-text: #555555;
            --success-color: #4caf50;
            --shadow-color: rgba(0,0,0,0.1);
            --modal-overlay: rgba(0,0,0,0.5);
            --button-text: #ffffff;
        }

        body.dark-theme {
            --primary-color: #60a5fa;
            --primary-color-dark: #3b82f6;
            --primary-color-active: #1d4ed8;
            --background-color: #0f172a;
            --surface-color: #111827;
            --surface-border: rgba(148, 163, 184, 0.18);
            --surface-muted: #172033;
            --card-back: #2563eb;
            --card-front: #1f2937;
            --text-color: #f3f4f6;
            --muted-text: #cbd5e1;
            --success-color: #4ade80;
            --shadow-color: rgba(0,0,0,0.45);
            --modal-overlay: rgba(2, 6, 23, 0.72);
            --button-text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(180deg, var(--background-color) 0%, color-mix(in srgb, var(--background-color) 83%, #000 17%) 100%);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header p,
        .score-note,
        .scores-list p,
        .modal-content p {
            color: var(--muted-text);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 1rem;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 12px;
            box-shadow: 0 2px 4px var(--shadow-color);
            margin-bottom: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat h2 {
            color: var(--muted-text);
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .grid-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .grid-btn {
            min-width: 120px;
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.12);
        }

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            min-width: 150px;
            margin-top: 0.25rem;
            border: 1px solid var(--surface-border);
            background: linear-gradient(180deg, var(--surface-color), var(--surface-muted));
            color: var(--text-color);
            box-shadow: 0 3px 14px var(--shadow-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .theme-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px var(--shadow-color);
        }

        .theme-toggle:focus-visible {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        .theme-toggle .theme-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.8rem;
            height: 1.8rem;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            font-size: 1rem;
            transition: transform 0.25s ease;
        }

        body.dark-theme .theme-toggle .theme-icon {
            transform: rotate(12deg) scale(1.05);
        }

        button {
            padding: 0.6rem 1.1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary-color);
            color: var(--button-text);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:hover {
            background-color: var(--primary-color-dark);
        }

        button.active {
            background-color: var(--primary-color-active);
        }

        .game-grid {
            display: grid;
            gap: 10px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
            max-width: 600px;
        }

        .grid-6x6 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 800px;
        }

        .card {
            aspect-ratio: 3/4;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card:focus {
            outline: 3px solid var(--primary-color);
            outline-offset: 2px;
        }

        .card[aria-pressed="true"] {
            transform: rotateY(180deg);
        }

        .card.matched {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            box-shadow: 0 2px 4px var(--shadow-color);
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .card-front {
            background: var(--card-front);
            color: var(--text-color);
            transform: rotateY(180deg);
        }

        .card-back {
            background: linear-gradient(135deg, var(--card-back), color-mix(in srgb, var(--card-back) 76%, #000 24%));
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--surface-color);
            color: var(--text-color);
            border: 1px solid var(--surface-border);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 12px 32px var(--shadow-color);
        }

        .best-scores {
            margin-top: 2rem;
            text-align: center;
        }

        .scores-list {
            max-width: 600px;
            margin: 1rem auto;
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 1rem;
            border-radius: 12px;
            color: var(--text-color);
        }

        @media (max-width: 600px) {
            .controls {
                flex-direction: column;
                align-items: center;
            }

            .game-grid {
                gap: 5px;
            }

            .card-face {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Game header with title and instructions -->
        <header class="header">
            <h1>Memory Game</h1>
            <p>Match all the pairs to win! Use keyboard or mouse to play.</p>
        </header>

        <!-- Game statistics panel -->
        <div class="controls">
            <div class="stat">
                <h2>Moves</h2>
                <p class="stat-value moves" aria-live="polite">0</p>
            </div>
            <div class="stat">
                <h2>Time</h2>
                <p class="stat-value timer" aria-live="polite">00:00</p>
            </div>
            <div class="stat">
                <h2>Rating</h2>
                <p class="stat-value rating" aria-live="polite">★★★</p>
            </div>
        </div>

        <!-- Grid size selector -->
        <div class="grid-selector">
            <button class="grid-btn active" data-size="4">4x4 Grid</button>
            <button class="grid-btn" data-size="6">6x6 Grid</button>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
                <span class="theme-icon" aria-hidden="true">🌙</span>
                <span class="theme-label">Dark Mode</span>
            </button>
        </div>

        <!-- Game grid -->
        <div class="game-grid grid-4x4" role="grid" aria-label="Memory Game Grid"></div>

        <!-- Best scores section -->
        <div class="best-scores">
            <h2>Best Scores</h2>
            <div class="scores-list"></div>
        </div>
    </div>

    <!-- Win modal -->
    <div class="modal" role="dialog" aria-label="Game Complete">
        <div class="modal-content">
            <h2>Congratulations!</h2>
            <p>You've completed the game!</p>
            <p class="final-stats"></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>

    <script>
        // Game state management
        const gameState = {
            moves: 0,
            matches: 0,
            timer: 0,
            timerInterval: null,
            firstCard: null,
            secondCard: null,
            canFlip: true,
            gridSize: 4,
            totalPairs: 8,
            gameStarted: false
        };

        // DOM Elements
        const elements = {
            grid: document.querySelector('.game-grid'),
            moves: document.querySelector('.moves'),
            timer: document.querySelector('.timer'),
            rating: document.querySelector('.rating'),
            modal: document.querySelector('.modal'),
            finalStats: document.querySelector('.final-stats'),
            gridButtons: document.querySelectorAll('.grid-btn'),
            scoresList: document.querySelector('.scores-list'),
            themeToggle: document.getElementById('theme-toggle')
        };

        // Card symbols (emojis) for both grid sizes
        const symbols = {
            '4x4': ['🎨', '🎭', '🎪', '🎫', '🎯', '🎲', '🎮', '🎰'],
            '6x6': ['🎨', '🎭', '🎪', '🎫', '🎯', '🎲', '🎮', '🎰', '🎱', '🎳', 
                   '🎸', '🎺', '🎻', '🎹', '🎷', '🥁', '🎼', '🎵']
        };

        // Shuffle array using Fisher-Yates algorithm
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Create a single card element
        function createCard(symbol, index) {
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('role', 'gridcell');
            card.setAttribute('aria-pressed', 'false');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `Card ${index + 1}`);
            
            card.innerHTML = `
                <div class="card-face card-front">${symbol}</div>
                <div class="card-face card-back">?</div>
            `;
            
            card.dataset.symbol = symbol;
            return card;
        }

        // Initialize or reset game grid
        function initializeGrid() {
            // Clear existing grid and reset game state
            elements.grid.innerHTML = '';
            gameState.moves = 0;
            gameState.matches = 0;
            gameState.firstCard = null;
            gameState.secondCard = null;
            gameState.canFlip = true;
            gameState.gameStarted = false;
            
            // Reset display elements
            elements.moves.textContent = '0';
            elements.rating.textContent = '★★★';
            clearInterval(gameState.timerInterval);
            gameState.timer = 0;
            elements.timer.textContent = '00:00';

            // Set up grid based on selected size
            const currentSymbols = symbols[`${gameState.gridSize}x${gameState.gridSize}`];
            gameState.totalPairs = currentSymbols.length;
            
            // Update grid class for correct layout
            elements.grid.className = `game-grid grid-${gameState.gridSize}x${gameState.gridSize}`;
            
            // Create and shuffle cards
            const shuffledSymbols = shuffle([...currentSymbols, ...currentSymbols]);
            shuffledSymbols.forEach((symbol, index) => {
                elements.grid.appendChild(createCard(symbol, index));
            });
        }

        // Start game timer
        function startTimer() {
            if (!gameState.gameStarted) {
                gameState.gameStarted = true;
                gameState.timerInterval = setInterval(() => {
                    gameState.timer++;
                    const minutes = Math.floor(gameState.timer / 60);
                    const seconds = gameState.timer % 60;
                    elements.timer.textContent = 
                        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }, 1000);
            }
        }

        // Update star rating based on number of moves
        function updateRating() {
            const moves = gameState.moves;
            const maxMoves = gameState.totalPairs * 2.5;
            
            if (moves <= maxMoves) {
                elements.rating.textContent = '★★★';
            } else if (moves <= maxMoves * 1.5) {
                elements.rating.textContent = '★★☆';
            } else {
                elements.rating.textContent = '★☆☆';
            }
        }

        // Check for win condition and handle game completion
        function checkWin() {
            if (gameState.matches === gameState.totalPairs) {
                clearInterval(gameState.timerInterval);
                
                // Save score to localStorage
                const score = {
                    moves: gameState.moves,
                    time: gameState.timer,
                    rating: elements.rating.textContent,
                    gridSize: gameState.gridSize,
                    date: new Date().toISOString()
                };
                
                const scores = JSON.parse(localStorage.getItem('memoryGameScores') || '[]');
                scores.push(score);
                scores.sort((a, b) => a.moves - b.moves);
                localStorage.setItem('memoryGameScores', JSON.stringify(scores.slice(0, 5)));
                
                // Show win modal
                elements.finalStats.textContent = `
                    Moves: ${gameState.moves}
                    Time: ${elements.timer.textContent}
                    Rating: ${elements.rating.textContent}
                `;
                elements.modal.style.display = 'flex';
                
                updateScoresList();
            }
        }

        // Update the display of best scores
        function updateScoresList() {
            const scores = JSON.parse(localStorage.getItem('memoryGameScores') || '[]');
            elements.scoresList.innerHTML = scores.length ? 
                scores.map((score, index) => `
                    <p>${index + 1}. ${score.gridSize}x${score.gridSize} Grid - 
                       ${score.moves} Moves, 
                       Time: ${Math.floor(score.time / 60)}:${(score.time % 60).toString().padStart(2, '0')}, 
                       Rating: ${score.rating}</p>
                `).join('') :
                '<p>No scores yet. Start playing to set some records!</p>';
        }

        // Handle card flip logic
        function flipCard(card) {
            if (!gameState.canFlip || card.classList.contains('matched') || 
                card.getAttribute('aria-pressed') === 'true') return;

            startTimer();
            card.setAttribute('aria-pressed', 'true');

            if (!gameState.firstCard) {
                gameState.firstCard = card;
            } else if (!gameState.secondCard && card !== gameState.firstCard) {
                gameState.secondCard = card;
                gameState.canFlip = false;
                gameState.moves++;
                elements.moves.textContent = gameState.moves;
                updateRating();

                // Check for match
                if (gameState.firstCard.dataset.symbol === gameState.secondCard.dataset.symbol) {
                    gameState.matches++;
                    gameState.firstCard.classList.add('matched');
                    gameState.secondCard.classList.add('matched');
                    gameState.firstCard.setAttribute('aria-label', 'Matched');
                    gameState.secondCard.setAttribute('aria-label', 'Matched');
                    gameState.firstCard = null;
                    gameState.secondCard = null;
                    gameState.canFlip = true;
                    checkWin();
                } else {
                    // No match - flip cards back
                    setTimeout(() => {
                        gameState.firstCard.setAttribute('aria-pressed', 'false');
                        gameState.secondCard.setAttribute('aria-pressed', 'false');
                        gameState.firstCard = null;
                        gameState.secondCard = null;
                        gameState.canFlip = true;
                    }, 1000);
                }
            }
        }

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            const themeLabel = elements.themeToggle.querySelector('.theme-label');
            const themeIcon = elements.themeToggle.querySelector('.theme-icon');

            document.body.classList.toggle('dark-theme', isDark);
            themeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
            themeIcon.textContent = isDark ? '☀️' : '🌙';
            elements.themeToggle.setAttribute('aria-pressed', String(isDark));

            try {
                localStorage.setItem('memoryGameTheme', theme);
            } catch (error) {
                console.warn('Unable to save theme preference:', error);
            }
        }

        function initializeTheme() {
            let savedTheme = 'light';

            try {
                savedTheme = localStorage.getItem('memoryGameTheme') || 'light';
            } catch (error) {
                console.warn('Unable to read persisted theme:', error);
            }

            applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
        }

        // Event Listeners
        elements.grid.addEventListener('click', (e) => {
            const card = e.target.closest('.card');
            if (card) flipCard(card);
        });

        elements.grid.addEventListener('keydown', (e) => {
            const card = e.target.closest('.card');
            if (card && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                flipCard(card);
            }
        });

        elements.themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.contains('dark-theme');
            applyTheme(isDark ? 'light' : 'dark');
        });

        document.querySelector('.play-again').addEventListener('click', () => {
            elements.modal.style.display = 'none';
            initializeGrid();
        });

        elements.gridButtons.forEach(button => {
            button.addEventListener('click', () => {
                const size = parseInt(button.dataset.size);
                if (size !== gameState.gridSize) {
                    gameState.gridSize = size;
                    elements.gridButtons.forEach(btn => btn.classList.toggle('active'));
                    initializeGrid();
                }
            });
        });

        // Initialize game
        initializeTheme();
        updateScoresList();
        initializeGrid();
    </script>
</body>
</html>
